# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true

  auto_review:
    enabled: true
    base_branches:
      - "main"
      - "master"
      - "develop"
      - "feature/*"
      - "bugfix/*"
      - "hotfix/*"
      - "release/*"

    ignore_title_keywords:
      - "WIP"
      - "[skip-review]"
      - "docs:"
      - "chore:"
      - "style:"
      - "refactor(docs):"
      - "chore(deps):"
      - "build(deps):"

    drafts: true

  path_filters:
    - "src/**/*.py"
    - "tests/**/*.py"
    - "main.py"
    - "cli.py"
    - "pyproject.toml"
    - "!**/*.md"
    - "!docs/**"
    - "!data/**"
    - "!logs/**"
    - "!notebooks/**"
    - "!config.yaml"
    - "!Makefile"
    - "!.gitignore"
    - "!.env*"
    - "!.pre-commit-config.yaml"
    - "!tests/fixtures/**"
    - "!tests/data/**"

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        **Role:** Senior Python Architect. Focus on SOLID, clean code, and robustness.
        - **Principles:** Is this module/function violating SRP or DRY? Is it overly complex?
        - **Resilience:** How does it handle `None` values or empty collections? Is `logger.exception` used in `except` blocks?
        - **Project Standards:** Are file paths handled via `pathlib`? Is the forbidden `print()` function used for debugging?

    - path: "src/ai/**/*.py"
      instructions: |
        **Role:** Principal AI/ML Engineer. Focus on model interaction, performance, and data integrity.
        - **API Resilience:** How are external API calls handled? Is there proper timeout, retry logic, and error handling?
        - **Data Contracts:** Are the data structures sent to/received from AI models validated (e.g., with Pydantic)?
        - **Efficiency:** Are embeddings cached? Are batch operations used?

    - path: "src/data_collector/**/*.py"
      instructions: |
        **Role:** Senior Data Engineer. Focus on scraping robustness and data quality.
        - **Resilience:** How does the scraper handle network errors, timeouts, or HTML structure changes?
        - **Data Validation:** Is scraped data cleaned and validated before storage?
        - **Ethics & Performance:** Is there a respectful delay between requests? Are async patterns used correctly?

    - path: "tests/**/*.py"
      instructions: |
        **Role:** Senior QA Engineer. Focus on test quality, coverage, and best practices.
        - **Pytest Best Practices:** Are fixtures used effectively? Is `@pytest.mark.parametrize` used for multiple scenarios?
        - **Assertion Clarity:** Are assertion messages clear? Does the test cover both happy paths and edge cases?
        - **Mocking:** Are mocks correctly scoped to ensure true unit test isolation?

    - path: "pyproject.toml"
      instructions: |
        **Role:** DevOps & Dependency Manager.
        - **Dependency Sanity:** Are there conflicting or insecure dependencies? Are version pins too loose (`*`)?
        - **Tooling:** Are new tools (`[tool.*]`) added without team consensus?

# ⭐ DÜZELTME v3.2: 'code_generation' ve 'docstrings' şema ile tam uyumlu hale getirildi.
# Docstring üretimi, genel bir talimatla etkinleştirilir.
code_generation:
  docstrings:
    path_instructions:
      - path: "src/**/*.py"
        instructions: |
          **Role:** Python Documentation Specialist.
          - Generate comprehensive Google-style docstrings for all public classes and functions.
          - The docstring should accurately describe the function's purpose, arguments, and return values.
          - Do not generate docstrings for private methods (e.g., `_my_private_method`).

# Projenin kendi linter'ları olduğu için dahili araçları kapalı tut.
tools:
  ruff:
    enabled: false
  shellcheck:
    enabled: false
  markdownlint:
    enabled: false
